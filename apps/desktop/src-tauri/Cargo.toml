[package]
name = "epistemics-desktop"
version = "0.1.0"
description = "Epistemics desktop shell (Tauri 2)"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# The library holds all logic so it can be unit-tested (`cargo test --lib`) and reused by the
# mobile entry point later; `main.rs` is a two-line shim.
name = "epistemics_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Register packages/db/migrations/*.sql with tauri-plugin-sql so Rust applies them on `Database.load`.
# Off by default: packages/db applies the same files itself (see src/migrations.rs), and applying
# them twice fails on the second CREATE TABLE. Enable only if the JS side stops running migrations on Tauri.
rust-migrations = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
