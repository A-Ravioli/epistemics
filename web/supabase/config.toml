# Minimal Supabase CLI config for Epistemics. `supabase link --project-ref <ref>` fills in the rest.
project_id = "epistemics"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:4173", "http://localhost:5173", "tauri://localhost", "http://tauri.localhost"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.anthropic-proxy]
verify_jwt = true
