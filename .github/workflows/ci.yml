name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm --filter @epistemics/web build
      - name: e2e (chromium)
        run: |
          pnpm --filter @epistemics/web exec playwright install --with-deps chromium
          pnpm --filter @epistemics/web e2e
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: cargo fmt --all --check
        working-directory: apps/desktop/src-tauri
      - run: cargo check
        working-directory: apps/desktop/src-tauri
